version: 2

sources:
  - name: civic_311
    description: "Raw enriched service requests loaded by the streaming pipeline."
    # Snowflake: the CIVIC_311 database. DuckDB: the local file's catalog.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'CIVIC_311') if target.type == 'snowflake' else target.database }}"
    schema: RAW
    tables:
      - name: service_requests
        identifier: SERVICE_REQUESTS
        description: "One row per Chicago 311 service request, enriched with LLM urgency classification."
        columns:
          - name: service_request_id
            description: "Stable Open311 service request identifier."
            tests:
              - unique
              - not_null
          - name: urgency_label
            description: "LLM-assigned urgency tier. 'Unknown' for backfilled rows."
            tests:
              - accepted_values:
                  arguments:
                    values: ['Critical', 'High', 'Medium', 'Low', 'Unknown']
          - name: status
            tests:
              - not_null
          - name: requested_datetime
            tests:
              - not_null

  - name: chicago_portal
    description: "Chicago Data Portal 311 extract (dataset v6vf-nfxy), landed by ingestion/portal_loader.py. Append-only: one row per request per pull."
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'CIVIC_311') if target.type == 'snowflake' else target.database }}"
    schema: RAW
    tables:
      - name: portal_requests
        identifier: PORTAL_REQUESTS
        description: "Every version of every request seen by any pull. Grain: (pull_id, sr_number)."
        columns:
          - name: sr_number
            tests:
              - not_null
          - name: pull_id
            tests:
              - not_null
      - name: portal_pulls
        identifier: PORTAL_PULLS
        description: "Pull ledger. Grain: (pull_id, partition_date). Portal count before/after paging vs landed count."
      - name: portal_parent_lookup
        identifier: PORTAL_PARENT_LOOKUP
        description: "Parent requests referenced by landed rows but created outside the pulled window, looked up by ID."
